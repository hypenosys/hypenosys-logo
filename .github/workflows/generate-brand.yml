name: Generate Hypenosys brand assets
on:
  push:
    branches: [feat/brand-v2-pixel-art, master]
    paths:
      - 'source/brand-v2.svg.json.gz.b64'
      - 'scripts/generate_brand.py'
      - '.github/workflows/generate-brand.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13' 'CairoSVG>=2.7,<3'
      - run: python scripts/generate_brand.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add logo_simple.svg logo_icon.svg favicon.svg favicon.ico favicon-16x16.png favicon-32x32.png android-chrome-192x192.png android-chrome-512x512.png apple-touch-icon.png previews/ source/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'feat(brand): publish approved v2 logos, previews and favicons'
            git push
          fi
